name: Build Bolt Studio (Windows exe)

on:
  workflow_dispatch: {}
  push:
    tags:
      - "bolt-studio-v*"
  pull_request:
    paths:
      - "editor/**"
      - ".github/workflows/build-bolt-studio.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Bolt (this repo)
        uses: actions/checkout@v4
        with:
          path: bolt-repo

      - name: Clone VSCodium build tooling
        run: git clone --depth 1 https://github.com/VSCodium/vscodium.git vscodium-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscodium-src/.nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Bolt Studio branding
        run: cp bolt-repo/editor/branding/product.json vscodium-src/product.json

      - name: Fetch upstream VS Code source
        working-directory: vscodium-src
        env:
          CI_BUILD: "no"
          VSCODE_QUALITY: stable
          OS_NAME: windows
          VSCODE_ARCH: x64
        run: ./get_repo.sh

      - name: Bake in Bolt language support
        run: |
          rm -rf vscodium-src/vscode/extensions/bolt-lang
          cp -r bolt-repo/editor/vscode-bolt vscodium-src/vscode/extensions/bolt-lang

      - name: Build Bolt Studio
        working-directory: vscodium-src
        env:
          CI_BUILD: "no"
          VSCODE_QUALITY: stable
          SHOULD_BUILD: "yes"
          SHOULD_BUILD_REH: "no"
          SHOULD_BUILD_REH_WEB: "no"
          OS_NAME: windows
          VSCODE_ARCH: x64
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "=== build.sh attempt ${attempt} ==="
            # VS Code's Windows gulp pipeline (vscode-min-prepack) occasionally
            # loses a race and its `npm -v` sanity check fails transiently
            # (seen as "The syntax of the command is incorrect" or "The system
            # cannot execute the specified program" - different OS-level
            # symptoms, same failure point, on unrelated CI runs). It is not
            # something in this repo's own source. VS Code's build caches
            # compiled output on disk, so re-invoking build.sh after a failure
            # resumes near where it left off instead of redoing the full
            # ~40 minute build - cheap to retry in place.
            ./build.sh && { echo "build.sh succeeded on attempt ${attempt}"; exit 0; }
            status=$?
            echo "build.sh failed on attempt ${attempt} (exit ${status})"
          done
          echo "build.sh failed after 3 attempts"
          exit 1

      - name: Locate and zip the build output
        run: |
          set -ex
          OUT_DIR=$(ls -d vscodium-src/VSCode-win32-x64 2>/dev/null || ls -d VSCode-win32-x64)
          ls "$OUT_DIR"
          7z a BoltStudio-win32-x64.zip "$OUT_DIR"/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoltStudio-win32-x64
          path: BoltStudio-win32-x64.zip
          retention-days: 30

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/bolt-studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: BoltStudio-win32-x64.zip
