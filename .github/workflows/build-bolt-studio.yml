name: Build Bolt Studio (Windows exe + Linux tarball)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "bolt-studio-v*"
  pull_request:
    paths:
      - "editor/**"
      - ".github/workflows/build-bolt-studio.yml"

# A VSCodium build is long, but it must not leave a dead run consuming a
# runner forever or let retries pile up behind it.
concurrency:
  # Keep release-tag builds independent from the continuous main-branch build.
  # A tag push also updates the branch, so one shared group would cancel the
  # release before it can attach its installers to the GitHub Release.
  group: bolt-studio-packaging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Bolt (this repo)
        uses: actions/checkout@v4
        with:
          path: bolt-repo

      - name: Clone VSCodium build tooling
        run: git clone --depth 1 https://github.com/VSCodium/vscodium.git vscodium-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscodium-src/.nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Bolt Studio branding
        run: cp bolt-repo/editor/branding/product.json vscodium-src/product.json

      - name: Build native nboltc.exe
        # Deliberately NOT using ilammy/msvc-dev-cmd here: that action
        # writes its PATH/env changes to $GITHUB_ENV, which persists to
        # every later step in this job - confirmed by a real failure
        # here, where it broke link.exe for the Rust crates (serde_core,
        # proc-macro2, quote) VSCodium's own "Build Bolt Studio" step
        # compiles further down. Instead, call vcvars64.bat inside this
        # one cmd.exe session only, so its environment changes never
        # leak past this single step.
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd bolt-repo\native
          cl /O2 /nologo bolt.c /Fe:nboltc.exe user32.lib gdi32.lib winmm.lib /link /STACK:67108864

      - name: Bundle nboltc.exe into the extension
        run: |
          mkdir -p bolt-repo/editor/vscode-bolt/bin
          cp bolt-repo/native/nboltc.exe bolt-repo/editor/vscode-bolt/bin/nboltc.exe

      - name: Fetch upstream VS Code source
        working-directory: vscodium-src
        env:
          CI_BUILD: "no"
          VSCODE_QUALITY: stable
          OS_NAME: windows
          VSCODE_ARCH: x64
        run: ./get_repo.sh

      - name: Bake in Bolt language support
        run: |
          rm -rf vscodium-src/vscode/extensions/bolt-lang
          cp -r bolt-repo/editor/vscode-bolt vscodium-src/vscode/extensions/bolt-lang

      - name: Build Bolt Studio
        working-directory: vscodium-src
        env:
          CI_BUILD: "no"
          VSCODE_QUALITY: stable
          SHOULD_BUILD: "yes"
          SHOULD_BUILD_REH: "no"
          SHOULD_BUILD_REH_WEB: "no"
          OS_NAME: windows
          VSCODE_ARCH: x64
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: ./build.sh

      - name: Install Inno Setup
        # VSCodium's plain build.sh only produces the portable app
        # (VSCode-win32-x64/Bolt Studio.exe), not an installer - confirmed
        # by an actual failed run here (build-bolt-studio-v0.2.0) whose logs
        # showed only Bolt Studio.exe and inno_updater.exe present, no
        # Setup*.exe. Rather than fight VSCodium's own internal packaging
        # scripts, wrap the real, working portable build in our own Inno
        # Setup installer - windows-2022 runners ship Chocolatey, so this
        # needs no extra setup-action dependency.
        run: choco install innosetup -y --no-progress

      - name: Write Inno Setup script
        shell: bash
        run: |
          set -ex
          VERSION="${GITHUB_REF_NAME#bolt-studio-v}"
          cat > vscodium-src/bolt-studio.iss <<EOF
          [Setup]
          AppId={{B0175700-D105-4000-8000-000000000001}}
          AppName=Bolt Studio
          AppVersion=${VERSION}
          AppPublisher=Bolt Language Project
          AppPublisherURL=https://bolt-lang.vercel.app
          AppSupportURL=https://github.com/teo12342/Language
          AppUpdatesURL=https://github.com/teo12342/Language/releases
          AppCopyright=Copyright (C) 2026 Bolt Language Project
          VersionInfoCompany=Bolt Language Project
          VersionInfoProductName=Bolt Studio
          VersionInfoDescription=Bolt Studio Setup
          VersionInfoCopyright=Copyright (C) 2026 Bolt Language Project
          DefaultDirName={autopf}\Bolt Studio
          DefaultGroupName=Bolt Studio
          OutputDir=..
          OutputBaseFilename=BoltStudio-Setup-win32-x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          UninstallDisplayIcon={app}\Bolt Studio.exe

          [Files]
          Source: "VSCode-win32-x64\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{group}\Bolt Studio"; Filename: "{app}\Bolt Studio.exe"
          Name: "{commondesktop}\Bolt Studio"; Filename: "{app}\Bolt Studio.exe"; Tasks: desktopicon
          Name: "{group}\Uninstall Bolt Studio"; Filename: "{uninstallexe}"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\Bolt Studio.exe"; Description: "Launch Bolt Studio"; Flags: nowait postinstall skipifsilent
          EOF
          # No custom setup icon: bolt-lang ships only SVG icons and Inno
          # Setup needs a real .ico, so this installer uses Inno's default.
          cat vscodium-src/bolt-studio.iss

      - name: Compile the installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" vscodium-src\bolt-studio.iss'

      - name: Verify the installer exe exists
        # Inno Setup's OutputDir=".." (relative to bolt-studio.iss, inside
        # vscodium-src/) already lands the exe right here at the workspace
        # root under the exact name we want - nothing left to move/rename.
        run: |
          set -ex
          if [ ! -f "BoltStudio-Setup-win32-x64.exe" ]; then
            echo "::error::Inno Setup did not produce BoltStudio-Setup-win32-x64.exe - check the 'Compile the installer' step's output."
            find . -maxdepth 2 -iname "*.exe"
            exit 1
          fi
          ls -la BoltStudio-Setup-win32-x64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoltStudio-Setup-win32-x64
          path: BoltStudio-Setup-win32-x64.exe
          retention-days: 30

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/bolt-studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: BoltStudio-Setup-win32-x64.exe

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Bolt (this repo)
        uses: actions/checkout@v4
        with:
          path: bolt-repo

      - name: Clone VSCodium build tooling
        run: git clone --depth 1 https://github.com/VSCodium/vscodium.git vscodium-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscodium-src/.nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rpm libsdl2-dev

      - name: Apply Bolt Studio branding
        run: cp bolt-repo/editor/branding/product.json vscodium-src/product.json

      - name: Build native nboltc
        run: bash bolt-repo/native/build-linux.sh

      - name: Bundle nboltc into the extension
        run: |
          mkdir -p bolt-repo/editor/vscode-bolt/bin
          cp bolt-repo/native/nboltc bolt-repo/editor/vscode-bolt/bin/nboltc
          chmod +x bolt-repo/editor/vscode-bolt/bin/nboltc

      - name: Fetch upstream VS Code source
        working-directory: vscodium-src
        env:
          CI_BUILD: "no"
          VSCODE_QUALITY: stable
          OS_NAME: linux
          VSCODE_ARCH: x64
        run: ./get_repo.sh

      - name: Bake in Bolt language support
        run: |
          rm -rf vscodium-src/vscode/extensions/bolt-lang
          cp -r bolt-repo/editor/vscode-bolt vscodium-src/vscode/extensions/bolt-lang

      - name: Build Bolt Studio
        working-directory: vscodium-src
        env:
          CI_BUILD: "no"
          VSCODE_QUALITY: stable
          SHOULD_BUILD: "yes"
          SHOULD_BUILD_REH: "no"
          SHOULD_BUILD_REH_WEB: "no"
          OS_NAME: linux
          VSCODE_ARCH: x64
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: ./build.sh

      - name: Package the portable tarball
        # VSCodium's build.sh (run with working-directory: vscodium-src
        # above) writes its output there too, as VSCode-linux-x64/ - not
        # at the workspace root. A second real bug found running this for
        # real: unlike the Windows portable build (Bolt Studio.exe sits
        # at the top level), VSCodium's Linux min-packing output does not
        # put the codium launcher at bin/codium - "chmod +x
        # .../bin/codium" failed with "No such file or directory" even
        # after the working-directory fix. Rather than hardcode a second
        # guess at the real path, this finds whatever "codium"-named
        # executable(s) min-packing actually produced and chmods those -
        # the listing below also prints the real layout to the log for
        # whoever debugs this next.
        working-directory: vscodium-src
        run: |
          set -ex
          mkdir -p BoltStudio-linux-x64
          mv VSCode-linux-x64 BoltStudio-linux-x64/
          cp ../bolt-repo/editor/linux/install.sh BoltStudio-linux-x64/
          chmod +x BoltStudio-linux-x64/install.sh
          echo "--- VSCode-linux-x64 top-level contents ---"
          ls -la BoltStudio-linux-x64/VSCode-linux-x64
          # Confirmed by a real build: the branding's applicationName
          # ("bolt-studio" in editor/branding/product.json) is what
          # VSCodium actually names the Linux launcher, at the top level
          # - not "codium", and not under bin/ (both wrongly assumed
          # earlier, before checking a real build's output).
          find BoltStudio-linux-x64/VSCode-linux-x64 -maxdepth 1 \( -iname "bolt-studio*" -o -iname "codium*" \) -print
          find BoltStudio-linux-x64/VSCode-linux-x64 -maxdepth 1 \( -iname "bolt-studio*" -o -iname "codium*" \) -exec chmod +x {} \;
          tar czf ../BoltStudio-linux-x64.tar.gz BoltStudio-linux-x64

      - name: Verify the tarball exists
        run: |
          set -ex
          if [ ! -f "BoltStudio-linux-x64.tar.gz" ]; then
            echo "::error::Packaging did not produce BoltStudio-linux-x64.tar.gz - check the 'Package the portable tarball' step's output."
            find . -maxdepth 2 -iname "*.tar.gz"
            exit 1
          fi
          ls -la BoltStudio-linux-x64.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoltStudio-linux-x64
          path: BoltStudio-linux-x64.tar.gz
          retention-days: 30

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/bolt-studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: BoltStudio-linux-x64.tar.gz
